<!doctype html>
<html>
<head>
<meta charset="utf-8">

<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    width: 380px;
    padding: 12px;
    margin: 0;
  }

  input:not([type="checkbox"]),
  button {
    width: 100%;
    height: 34px;
    padding: 6px 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }

  button { cursor: pointer; }

  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .settings {
    display: none;
    border-top: 1px solid #ccc;
    padding-top: 8px;
    margin-top: 8px;
  }

  .section-title {
    font-size: 13px;
    font-weight: bold;
    margin: 6px 0 4px;
  }

  .spinner {
    width: 22px;
    height: 22px;
    border: 3px solid #ddd;
    border-top: 3px solid #333;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
    margin: 6px auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    font-size: 12px;
    color: #c00;
    margin-bottom: 6px;
    display: none;
  }

  #status {
    font-size: 13px;
    margin-bottom: 6px;
    min-height: 18px;
  }
</style>
</head>

<body>

<h3>Quick link</h3>

<input id="input" placeholder="Paste source link…" />
<input id="output" placeholder="Result API link…" readonly />

<div id="spinner" class="spinner"></div>
<div id="status"></div>

<button id="get">GET</button>
<button id="toggleSettings">Settings</button>

<div id="settings" class="settings">

  <div class="toggle">
    <input type="checkbox" id="usePublic">
    <label for="usePublic">Use public URL (tunnel)</label>
  </div>

  <div class="toggle" id="useLocalApiToggle">
    <input type="checkbox" id="useLocalApi">
    <label for="useLocalApi">Use local API for processing</label>
  </div>

  <div class="section-title">Local</div>
  <div class="row">
    <input id="localAddress" placeholder="127.0.0.1">
    <input id="localPort" placeholder="8080">
  </div>

  <div class="section-title">Public</div>
  <input id="globalUrl" placeholder="https://xxxx.trycloudflare.com">
  <div id="globalError" class="error"></div>
  <button id="refreshPublic">Refresh public URL</button>

</div>

<script src="popup.js"></script>
</body>
</html>
